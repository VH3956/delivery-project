services:
  # ==================== INFRASTRUCTURE ====================

  mysql:
    image: mysql:8.0
    container_name: delivery_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: delivery_db
      MYSQL_USER: delivery_user
      MYSQL_PASSWORD: delivery_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.3'
          memory: 256M

  redis:
    image: redis:7.0-alpine
    container_name: delivery_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: delivery_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: delivery_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ==================== MICROSERVICES ====================

  eureka-server:
    build:
      context: ./delivery-backend
      dockerfile: eureka-server/Dockerfile
    container_name: delivery_eureka
    ports:
      - "8761:8761"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 384M
        reservations:
          cpus: '0.2'
          memory: 256M

  api-gateway:
    build:
      context: ./delivery-backend
      dockerfile: api-gateway/Dockerfile
    container_name: delivery_gateway
    ports:
      - "9090:9090"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  user-service:
    build:
      context: ./delivery-backend
      dockerfile: user-service/Dockerfile
    container_name: delivery_user_service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 768M

  order-service:
    build:
      context: ./delivery-backend
      dockerfile: order-service/Dockerfile
    container_name: delivery_order_service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 768M

  delivery-service:
    build:
      context: ./delivery-backend
      dockerfile: delivery-service/Dockerfile
    container_name: delivery_dispatch_service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  mysql_data:
  redis_data: