services:
  # ==========================================
  # INFRASTRUCTURE (Your Original Setup)
  # ==========================================
  
  # 1. MySQL Database
  mysql:
    image: mysql:8.0
    container_name: delivery_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: delivery_db
      MYSQL_USER: delivery_user
      MYSQL_PASSWORD: delivery_password
    ports:
      - "3307:3306" # Host port 3307, Container port 3306
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # 2. Redis (Caching, OTP, Geo-location)
  redis:
    image: redis:7.0-alpine
    container_name: delivery_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 3. Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: delivery_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 4. Kafka (Message Broker)
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: delivery_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ==========================================
  # SPRING BOOT MICROSERVICES
  # ==========================================

  # 5. Eureka Service Registry
  eureka-server:
    build:
      context: ./delivery-backend
      dockerfile: eureka-server/Dockerfile
    container_name: delivery_eureka
    ports:
      - "8761:8761"

  # 6. API Gateway
  api-gateway:
    build:
      context: ./delivery-backend
      dockerfile: api-gateway/Dockerfile
    container_name: delivery_gateway
    ports:
      - "9090:9090"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  # 7. User Service
  user-service:
    build:
      context: ./delivery-backend
      dockerfile: user-service/Dockerfile
    container_name: delivery_user_service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306  # Internally
      - DB_USER=delivery_user
      - DB_PASSWORD=delivery_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - mysql
      - redis
      - eureka-server
    restart: on-failure

  # 8. Order Service
  order-service:
    build:
      context: ./delivery-backend
      dockerfile: order-service/Dockerfile
    container_name: delivery_order_service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=delivery_user
      - DB_PASSWORD=delivery_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mysql
      - eureka-server
    restart: on-failure

# 9. Delivery Dispatch Service
  delivery-service:
    build:
      context: ./delivery-backend
      dockerfile: delivery-service/Dockerfile
    container_name: delivery_dispatch_service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - redis
      - kafka
      - eureka-server

volumes:
  mysql_data:
  redis_data: