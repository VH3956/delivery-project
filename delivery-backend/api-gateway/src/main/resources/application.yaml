server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true # Helps with WebSocket handshake
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: 
              - "*"
            allowedMethods: 
              - "*"
            allowedHeaders: 
              - "*"
            allowCredentials: true
            
      discovery:
        locator:
          enabled: true
      routes:
        # Route all Authentication and User endpoints to the user-service
        - id: user-service-route
          uri: lb://USER-SERVICE  # Must match the spring.application.name of user-service
          predicates:
            - Path=/api/auth/**, /api/users/**, /api/shippers/**, /api/admin/**

        # Route Order Service (NEW)
        - id: order-service-route
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**

        # Route Delivery Service (NEW)
        - id: delivery-service-route
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/delivery/**, /ws/delivery/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/