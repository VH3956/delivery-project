server:
  port: 8081 # user-service run 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3307/delivery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: delivery_user       # Match with docker-compose
    password: delivery_password   # Match with file docker-compose
  jpa:
    hibernate:
      ddl-auto: update # Spring Boot auto deploy table
    show-sql: true