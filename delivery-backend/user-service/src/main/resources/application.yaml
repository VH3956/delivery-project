server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    # Use environment variables for DB credentials, fallback to defaults for local dev
    url: jdbc:mysql://${DB_HOST:localhost}:3306/delivery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:delivery_user}
    password: ${DB_PASSWORD:delivery_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    # Mail Configuration (Google SMTP)
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  # NO default value for the secret. This forces the app to fail if the secret is missing (Safe practice)
  secret: ${JWT_SECRET}
  # Default to 1 hour
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  # Default to 7 days
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true